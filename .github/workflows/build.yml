name: Build and Test

on:
  push:
    branches: [ main, develop, update/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Go Application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: wuzapi-test-only
          POSTGRES_DB: wuzapi_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Tidy dependencies
      run: go mod tidy

    - name: Check for uncommitted changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Error: go mod tidy produced changes. Please run 'go mod tidy' locally and commit the changes."
          git diff
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run tests with race detection and PostgreSQL regressions
      env:
        WUZAPI_TEST_POSTGRES_DSN: postgres://postgres:wuzapi-test-only@localhost:${{ job.services.postgres.ports[5432] }}/wuzapi_test?sslmode=disable
      run: go test -race ./...

    - name: Build application
      run: go build -v -o wuzapi

    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: wuzapi-binary
        path: wuzapi
        retention-days: 7
