services:
  wuzapi-server:
    container_name: wuzapi-jack-ai-main-server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${WUZAPI_PORT:-8080}:8080"
    environment:
      - WUZAPI_ADMIN_TOKEN=2025@Jack-ai-admin@123
      - DB_USER=jack-wuzapi
      - DB_PASSWORD=jack-wuzapi-admin@123
      - DB_NAME=jack-wuzapi
      - WUZAPI_GLOBAL_ENCRYPTION_KEY=${WUZAPI_GLOBAL_ENCRYPTION_KEY}
      - WUZAPI_GLOBAL_HMAC_KEY=${WUZAPI_GLOBAL_HMAC_KEY:-}
      - WUZAPI_GLOBAL_WEBHOOK=${WUZAPI_GLOBAL_WEBHOOK:-}
      - DB_HOST=db
      - DB_PORT=5432
      - TZ=Europe/Istanbul
      - WEBHOOK_FORMAT=json
      - SESSION_DEVICE_NAME=Jack-ai
      # RabbitMQ configuration Optional
      - RABBITMQ_URL=amqp://wuzapi:wuzapi@rabbitmq:5672/
      - RABBITMQ_QUEUE=whatsapp_events
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wuzapi-network
    restart: unless-stopped

  db:
    container_name: wuzapi-jack-ai-main-db
    image: postgres:16
    environment:
      POSTGRES_USER: jack-wuzapi
      POSTGRES_PASSWORD: jack-wuzapi-admin@123
      POSTGRES_DB: jack-wuzapi
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - wuzapi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jack-wuzapi"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wuzapi
      RABBITMQ_DEFAULT_PASS: wuzapi
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "127.0.0.1:5672:5672" # AMQP port
      - "127.0.0.1:15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wuzapi-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq-init:
    image: curlimages/curl:latest
    container_name: wuzapi-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: wuzapi
      RABBITMQ_DEFAULT_PASS: wuzapi
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_HOST: rabbitmq
    networks:
      - wuzapi-network
    volumes:
      - ./rabbitmq-init.sh:/rabbitmq-init.sh:ro
    entrypoint: ["/bin/sh", "/rabbitmq-init.sh"]
    restart: "no"

networks:
  wuzapi-network:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data:
